# llama-server router preset (Linux).  Adapted from countzero/windows_llama.cpp.
#
# One [section] per model. The section header is the name clients pass in the
# OpenAI-compatible "model" field. Keys are llama-server flags WITHOUT the
# leading "--"  (see:  llama-server --help  for every available flag).
#
# Setup:
#   cp presets/models.example.ini presets/models.ini
#   sed -i "s|/home/USER|$HOME|g" presets/models.ini
#
# Model paths must be ABSOLUTE and point INSIDE $LLAMA_MODELS_DIR (outside the
# repo). n-gpu-layers = -1 offloads all layers (clamped automatically).
#
# ctx-size / n-gpu-layers / n-cpu-moe / cache-type-k/v below are VERIFIED for
# the reference hardware this repo targets (AMD RX 7900 XTX, 24560 MiB VRAM,
# see llama.cpp/README.md + AGENTS.md) via
# `.claude/skills/llama-preset/scripts/recommend.sh` — each was actually probed
# with llama-fit-params (not guessed from file size), and cache-type-k=q8_0 /
# cache-type-v=q4_0 + parallel=1 + cache-reuse + reasoning-format=auto are its
# agentic quality/speed defaults (see the skill's SKILL.md). On different
# hardware (or after a llama.cpp/driver update), re-run that skill per model;
# it prints an OPTIMIZATION DIFF against whatever is already in your models.ini.
#
# Speculative decoding (spec-*) is lossless — the target model verifies every
# drafted token — so a wrong setting costs speed, never output quality. The
# ngram-mod speed gain is UNMEASURED on this reference hardware; it was adopted
# from countzero's 24 GB preset on mechanism, not on a benchmark.
#
# `fit = off` is deliberately NOT set here. It makes a VRAM shortfall fail at
# startup instead of silently shrinking unset arguments — useful once a preset is
# measured on one specific card, harmful in a template for unknown hardware.
#
# Set device parameter in this order:
# 1. device = Vulkan0 - if used with an Vulkan backend
# 2. device = Cuda0   - if used with an NVIDIA GPU


[Qwen3.6-27B]
alias = Qwen3.6-27B-IQ4_XS.gguf
model = /home/USER/.local/share/llama.cpp/models/Qwen3.6-27B/Qwen3.6-27B-IQ4_XS.gguf
ctx-size = 131072
n-gpu-layers = -1
cache-type-k = q8_0
cache-type-v = q4_0
flash-attn = auto
jinja = true
reasoning-format = auto
parallel = 1
cache-reuse = 256
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 4
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0
# Optional: override a buggy embedded chat template (fetch via models.list):
# chat-template-file = /home/USER/.local/share/llama.cpp/templates/chat_template.jinja

[Qwen3.6-35B-A3B]
alias = Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
model = /home/USER/.local/share/llama.cpp/models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
device = Vulkan0
ctx-size = 262144
n-gpu-layers = -1
cache-type-k = q8_0
cache-type-v = q4_0
flash-attn = auto
jinja = true
reasoning-format = auto
parallel = 1
cache-reuse = 256
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 4
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
# Card set "thinking mode, precise coding tasks" - use it whole, do not mix.
# The alternative whole set is "thinking mode, general tasks":
#   temp 1.0, top-p 0.95, top-k 20, min-p 0.0, presence-penalty 1.5
# That 1.5 belongs to temp 1.0 and must not be pulled into the coding set: a
# presence penalty punishes repeated tokens, which is what code is made of.
# The card also warns higher values can cause language mixing.
# (The 27B's general set uses 0.0 here instead of 1.5; the coding sets match.)
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0

[gemma-4-26B-A4B]
alias = gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
model = /home/USER/.local/share/llama.cpp/models/gemma-4-26B-A4B/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
device = Vulkan0
ctx-size = 262144
n-gpu-layers = -1
cache-type-k = q8_0
cache-type-v = q4_0
flash-attn = on
jinja = true
reasoning-format = auto
temp = 1.0
top-p = 0.95
top-k = 64
prio = 2
parallel = 1
cache-reuse = 256
# No MTP drafter for this model, but ngram-mod needs none.
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64

[gemma-4-31B]
alias = gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
