[Laguna-XS-2.1]
alias = Laguna-XS-2.1-IQ4_XS.gguf
model = /home/USER/.local/share/llama.cpp/models/Laguna-XS-2.1/Laguna-XS-2.1-IQ4_XS.gguf
device = Vulkan0
ctx-size = 32768
n-gpu-layers = -1
cache-type-k = q8_0
cache-type-v = q4_0
flash-attn = auto
jinja = true
reasoning-format = auto
parallel = 1
cache-reuse = 256
# No draft model exists for Laguna in llama.cpp's dflash arch, but ngram-mod
# needs none - this is the only speculator this model can use.
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
temp = 1.0
top-p = 1.0
top-k = 20

[Unlimited-OCR]
alias = Unlimited-OCR
model = /home/USER/.local/share/llama.cpp/models/Unlimited-OCR/Unlimited-OCR-Q8_0.gguf
mmproj = /home/USER/.local/share/llama.cpp/models/Unlimited-OCR/mmproj-Unlimited-OCR-F16.gguf
device = Vulkan0
ctx-size = 32768
n-gpu-layers = -1
flash-attn = auto
temp = 0
top-k = 1
repeat-penalty = 1.1
parallel = 1
# Greedy decoding (temp 0 / top-k 1) makes every draft either fully accepted or
# fully rejected, and scanned documents repeat structure heavily - so this is
# where ngram-mod should pay off most. Unmeasured.
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
